[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livret-a"
version = "0.1.0"
description = "Intérêts du Livret A et du LDDS : règle des quinzaines, historique des taux, plafond"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Théo Pasquier" }]
keywords = ["Livret A", "LDDS", "épargne", "intérêts", "quinzaine", "France"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
livret-a = "livret_a.__main__:main"

[project.urls]
Homepage = "https://github.com/TheoPSR01/livret-a"
Issues = "https://github.com/TheoPSR01/livret-a/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/livret_a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
